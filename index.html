<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Control de Inventario & Landed Cost</title>
  
  <!-- BOOTSTRAP 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- BOOTSTRAP ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <!-- HTML5 QR CODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <!-- ESTILOS PERSONALIZADOS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-box-seam text-warning fs-4"></i>
        <span>Control de Inventario & Landed Cost</span>
      </a>
      <div class="d-flex align-items-center text-white me-2">
        <span class="badge bg-secondary me-2">Tasa USD/DOP:</span>
        <input type="number" id="input-tasa-dop" class="form-control form-control-sm text-center fw-bold" style="width: 80px;" value="60.00" readonly>
      </div>
    </div>
  </nav>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="container-fluid px-4">

    <!-- SECCIÓN DE KPIs / MÉTRICAS -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card">
          <div class="kpi-title">Total Productos</div>
          <div class="kpi-value text-primary" id="metric-total-productos">0</div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card warning">
          <div class="kpi-title">Stock Total</div>
          <div class="kpi-value text-warning" id="metric-stock-total">0</div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card info">
          <div class="kpi-title">Capital (USD)</div>
          <div class="kpi-value text-info" id="metric-capital-usd">$0.00</div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card info">
          <div class="kpi-title">Capital (DOP)</div>
          <div class="kpi-value text-dark" id="metric-capital-dop">RD$ 0.00</div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card success">
          <div class="kpi-title">Margen Promedio</div>
          <div class="kpi-value text-success" id="metric-margen-promedio">0.0%</div>
        </div>
      </div>
      <div class="col-6 col-md-4 col-xl-2">
        <div class="card p-3 kpi-card success">
          <div class="kpi-title">Ganancia Potencial</div>
          <div class="kpi-value text-success" id="metric-ganancia-potencial">RD$ 0.00</div>
        </div>
      </div>
    </div>

    <!-- PANEL DE ACCIONES Y BÚSQUEDA -->
    <div class="card p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" id="input-busqueda-inventario" class="form-control" placeholder="Buscar por SKU o Nombre de producto...">
          </div>
        </div>
        <div class="col-md-7 d-flex gap-2 justify-content-md-end flex-wrap">
          <button class="btn btn-success d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalNuevoProducto">
            <i class="bi bi-plus-circle"></i> Nuevo Producto
          </button>
          <button class="btn btn-primary d-flex align-items-center gap-2" id="btn-toggle-escaner" onclick="iniciarEscanerQR()">
            <i class="bi bi-qr-code-scan"></i> Escáner QR
          </button>
          <button class="btn btn-outline-secondary d-flex align-items-center gap-2" onclick="cargarDatosBackend()">
            <i class="bi bi-arrow-clockwise"></i> Recargar
          </button>
        </div>
      </div>

      <!-- ÁREA DE CÁMARA PARA ESCÁNER QR -->
      <div class="row mt-3 justify-content-center">
        <div class="col-md-6">
          <div id="reader" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- TABLA DE INVENTARIO -->
    <div class="card shadow-sm mb-5">
      <div class="card-header bg-white py-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-list-stars text-primary me-2"></i>Inventario General</h5>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Producto</th>
